<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candy Way</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>Candy Way</h1>
      <p>Guide the candy to sweet victory! Use arrow keys or WASD.</p>
    </header>

    <section class="hud">
      <div><strong>Score:</strong> <span id="score">0</span></div>
      <div><strong>Best:</strong> <span id="best">0</span></div>
      <button id="restart" type="button">Restart</button>
    </section>

    <canvas id="game" width="420" height="420" aria-label="Candy Way game board"></canvas>

    <section class="legend">
      <span>🍬 Candy</span>
      <span>🍭 Treat</span>
      <span>⬛ Walls</span>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
